name: Safqah Holdings Limited
description: >-
  Safqah Holdings Limited operates Safqah (Safqah Capital / Safqah Financial), a
  Saudi Arabian fintech platform headquartered in the Al-Malqa district of Riyadh
  and regulated by the Saudi Capital Market Authority (CMA). Safqah provides
  Sharia-compliant, debt-based real estate investment opportunities that let
  qualified individual and institutional investors fund real estate development
  deals starting from 1,000 SAR, alongside a financing arm that offers land
  acquisition, residential development, commercial development, raw land, and
  bridge financing to real estate developers. Investors track deal performance
  through periodic reporting and live project camera feeds. The platform is a
  consumer- and investor-facing web application with no publicly documented
  developer API, SDK, or integration surface at this time.
